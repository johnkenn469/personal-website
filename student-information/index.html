<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        :root {
            --bg: #080808;
            --panel: #121212;
            --panel-2: #171717;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #a0a0a0;
            --accent: #c05656;
            --accent-soft: #d76f6f;
            --border: #2a2a2a;
            --input: #0f0f0f;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        #form-box {
            width: 100%;
            max-width: 560px;
            background: linear-gradient(180deg, var(--panel) 0%, #0d0d0d 100%);
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        h1, h2 {
            margin: 0 0 20px;
            text-align: center;
            color: var(--text);
            font-weight: 700;
        }

        h2 {
            margin-top: 28px;
            color: var(--muted);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--input);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 86, 86, 0.18);
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--accent);
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            background-color: transparent;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: var(--accent);
            color: #ffffff;
            transform: translateY(-1px);
        }

        #output {
            margin-top: 12px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 18px;
            line-height: 1.9;
            color: var(--text);
            min-height: 130px;
        }

        .student-item {
            color: var(--text);
            font-weight: 500;
        }

        .student-time {
            color: var(--muted);
            font-size: 12px;
        }

        .empty-slot {
            color: var(--muted);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div id="form-box">
        <h1>Student Information</h1>

        <form id="studentForm">
            <div class="form-group">
                <label for="fullName">Student Name:</label>
                <input type="text" id="fullName" placeholder="Enter student name" required>
                <input type="submit" value="Add Student">
            </div>
        </form>

        <h2>Attendance List:</h2>
        <div id="output"></div>
    </div>

    <script>
        const studentList = [];

        function renderList() {
            let listHTML = "";

            for (let i = 1; i <= 10; i++) {
                if (studentList[i - 1]) {
                    listHTML +=
                        "<div class='student-item'>" +
                        i + ". " + studentList[i - 1].name +
                        " <span class='student-time'>(Checked in at: " + studentList[i - 1].time + ")</span>" +
                        "</div>";
                } else {
                    listHTML += "<div class='empty-slot'>" + i + ". </div>";
                }
            }

            document.getElementById("output").innerHTML = listHTML;
        }

        document.getElementById("studentForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const nameInput = document.getElementById("fullName");
            const studentName = nameInput.value.trim();

            if (studentName === "") {
                alert("Please enter a student name.");
                return;
            }

            if (studentList.length < 10) {
                const now = new Date();
                const timestamp = now.toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                studentList.push({
                    name: studentName,
                    time: timestamp
                });

                nameInput.value = "";
                renderList();
            } else {
                alert("You have already reached the maximum limit of 10 students!");
            }
        });
    </script>

</body>
</html>
